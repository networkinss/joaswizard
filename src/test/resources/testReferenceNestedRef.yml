        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Pet:
      type: object
      properties:
        name:
          type: string
          minLength: 8
          example: Underdog
        amount:
          type: integer
          example: 3
        price:
          type: number
          example: 12.05
        status:
          type: string
          minLength: 9
          example: available
        tags:
          type: array
          items:
            type: string
          minLength: 5
          example: [dog, 4paws]
      required:
      - name
      - amount
      - price
      - status
      - tags
    Customer:
      type: object
      properties:
        firstname:
          type: string
          minLength: 4
          example: John
        lastname:
          type: string
          minLength: 3
          example: Doe
        age:
          type: integer
          example: 22
        address:
          $ref: '#/components/schemas/Address'
      required:
      - firstname
      - lastname
      - age
      - address
    Invoice:
      type: object
      properties:
        product:
          type: string
          minLength: 3
          example: Pet
        amount:
          type: integer
          example: 1
        price:
          type: number
          example: 12.05
      required:
      - product
      - amount
      - price
    Address:
      type: object
      properties:
        street:
          type: string
          minLength: 13
          example: roadtonowhere
        nr:
          type: integer
          example: 48
        city:
          type: string
          minLength: 7
          example: Nowhere
        countrycode:
          type: integer
          example: 11111
        country:
          type: string
          minLength: 7
          example: Nirwana
      required:
      - street
      - nr
      - city
      - countrycode
      - country
