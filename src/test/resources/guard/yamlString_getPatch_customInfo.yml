openapi: 3.0.2
info:
  version: 1.0.0
  title: Category API
  description: 'Custom description: with colon'
  contact:
    name: John Doe
    email: john.doe@example.com
    url: http://example.com
  license:
    name: Apache 2.0 license
    url: http://opensource.org/licenses/Apache-2.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local environment.
paths:
  /categorys:
    get:
      description: List of categorys.
      summary: List of categorys
      operationId: getCategoryList
      responses:
        '200':
          description: Category List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Unexpected internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /category/{id}:
    get:
      description: Returns category by id.
      summary: Returns category by id
      operationId: findCategoryByid
      parameters:
        - name: id
          in: path
          description: id of category to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Data with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Unexpected internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      description: Patches category by id,
      summary: Patches category by id
      operationId: patchCategory
      parameters:
        - name: id
          in: path
          description: ID of category to put
          required: true
          schema:
            type: string
      responses:
        '204':
          description: category patched.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Data with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Unexpected internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      requestBody:
        x-name: category
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        description: Category to be updated
        required: true
components:
  schemas:
    ErrorModel:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Category:
      type: object
      properties:
        name:
          type: string
          minLength: 8
          example: Underdog
        price:
          type: number
          example: 12.05
        status:
          type: string
          minLength: 9
          example: available
        tags:
          type: array
          items:
            type: string
          minLength: 5
          example: [dog, 4paws]
      required:
      - name
      - price
      - status
      - tags
