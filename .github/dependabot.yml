version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # Wait before proposing freshly published versions (malicious or unstable releases).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Custom Handlebars fork is bundled, must not be replaced by the stock release
      - dependency-name: "com.github.jknack:handlebars"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors in one PR instead of one PR per dependency
      maven-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
