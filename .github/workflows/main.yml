name: Run Spectral on Pull Requests

on:
  - pull_request

permissions:
  contents: read

jobs:
  build:
    name: Run Spectral
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run Spectral on all complete OpenAPI reference documents.
      # Excluded on purpose: testReferenceSchemaPet.yml and testReferenceSchemaPetObject.yml (schema fragments, no "openapi:" root).
      # The glob is a fast-glob pattern, so the brace list is supported.
      - uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: 'src/test/resources/testReference{Contact,CrudMaxOneObject,CrudMultipleYamlObject,CrudSingleYamlObject,GetMethodList,MinimalString,MySQLDBFieldsExcelsheet,NestedAddress,NestedEnvelope,NestedRef,SingleYamlObject,String}.yml'
          spectral_ruleset: .spectral.json
